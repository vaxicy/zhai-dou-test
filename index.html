<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>重生当嫡女测试</title>
<style>
  :root{
    --bg:#1B2321; --panel:#202A27; --paper:#F1E9DA; --paper2:#E9DFCB;
    --line:#CBB89B; --ink:#2E2A24; --sub:#6E6357; --muted:#9C8F7E;
    --brand:#9C3A31; --brand2:#B85F49; --gold:#C7A15B; --ok:#5C7A62; --die:#8E352A;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg);color:var(--ink);overflow-x:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Noto Serif SC","Songti SC","PingFang SC","Microsoft YaHei",serif;
    line-height:1.9;display:flex;justify-content:center;-webkit-font-smoothing:antialiased;}
  .wrap{width:100%;max-width:460px;min-height:100vh;padding:18px 18px 30px;display:flex;flex-direction:column;}

  .top{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .brand{display:flex;align-items:center;gap:10px;min-width:0;}
  .sealbox{width:30px;height:30px;flex:none;display:grid;place-items:center;background:var(--brand);
    color:#F3E9D9;font-size:16px;font-weight:800;border-radius:2px;}
  .top .name{font-size:15px;letter-spacing:4px;color:#E9DFCB;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .meta{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex:none;}
  .ep{font-size:10.5px;color:#AFA289;letter-spacing:1px;}

  .hr{height:1px;background:#3A423B;margin:12px 0;}
  .prog{margin-bottom:16px;}
  .bar{height:2px;background:#333B36;overflow:hidden;}
  .bar>i{display:block;height:100%;width:0;background:var(--brand);transition:width .3s ease;}
  .dots{display:flex;gap:6px;margin-top:8px;}
  .dots i{width:7px;height:7px;border-radius:1px;background:#3C463F;}
  .dots i.on{background:var(--brand);}

  .card{position:relative;background:var(--paper);border:1px solid var(--line);border-left:3px solid var(--brand);
    border-radius:2px;padding:16px;margin-bottom:14px;}
  .where{font-size:10.5px;color:var(--brand);letter-spacing:3px;font-weight:700;margin-bottom:9px;}
  .story{font-size:15px;color:var(--ink);margin:0;line-height:2;}

  .opt{position:relative;display:block;width:100%;text-align:left;background:var(--paper2);
    border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:2px;
    padding:12px 14px 12px 32px;margin-bottom:9px;font-size:14.5px;color:var(--ink);line-height:1.65;
    cursor:pointer;transition:border-color .15s,background .15s,transform .15s;}
  .opt::before{content:"◈";position:absolute;left:11px;top:12px;color:var(--gold);font-size:12px;}
  .opt:hover{border-color:var(--brand);border-left-color:var(--brand);background:#EFE4D0;transform:translateX(2px);}
  .opt:active{background:#E6D9C1;}

  .chapter{padding:22px 4px;}
  .frame{border:1px solid #6E5C3C;box-shadow:inset 0 0 0 4px var(--bg),inset 0 0 0 5px rgba(199,161,91,.35);
    border-radius:2px;padding:24px 18px;background:var(--panel);text-align:center;}
  .chapter .vol{font-size:11px;letter-spacing:6px;color:var(--brand2);margin-bottom:12px;}
  .chapter h2{font-size:24px;font-weight:800;letter-spacing:6px;margin:0 0 16px;color:#EADFC9;}
  .chapter .ci{font-size:13.5px;color:#B7AB93;text-align:left;margin:0 0 20px;line-height:2;}
  .chapter .go{width:100%;border:1px solid #7E2C25;border-radius:2px;padding:12px;background:var(--brand);
    color:#F3E9D9;font-size:14px;letter-spacing:4px;cursor:pointer;}
  .chapter .go:active{background:#7E2C25;}

  .cover{position:relative;text-align:center;padding:28px 6px 12px;color:#E9DFCB;overflow:hidden;}
  .cover .wm{position:absolute;right:-14px;top:6px;font-size:150px;font-weight:800;line-height:1;
    color:rgba(156,58,49,.12);pointer-events:none;user-select:none;}
  .cover .seal{font-size:11px;letter-spacing:9px;color:var(--gold);margin-bottom:16px;}
  .cover h1{font-size:30px;font-weight:800;letter-spacing:9px;color:#F1E7D2;margin:0 0 14px;
    line-height:1.5;text-indent:9px;}
  .cover .lead{font-size:13.5px;color:#BFB196;margin-bottom:22px;line-height:2.05;}
  .cover .rulebox{font-size:12.5px;color:#B2A68F;background:var(--panel);border:1px solid #3D463F;
    border-left:3px solid var(--brand);border-radius:2px;padding:14px;text-align:left;margin-bottom:22px;line-height:1.95;}
  .start{width:100%;border:1px solid #6E5C3C;border-radius:2px;padding:14px;background:var(--brand);
    color:#F3E9D9;font-size:16px;font-weight:700;letter-spacing:7px;cursor:pointer;}
  .start:active{background:#7E2C25;}

  .end{text-align:center;padding-top:14px;}
  .endline{width:42px;height:3px;background:var(--brand);margin:0 auto 16px;}
  .end .tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:3px;padding:4px 12px;
    border-radius:2px;margin-bottom:14px;}
  .end.die .tag{background:#3A2824;color:#E2A79A;border:1px solid #5A3A33;}
  .end.life .tag{background:#22332A;color:#A9CBB0;border:1px solid #39503F;}
  .end .big{font-size:24px;font-weight:800;margin:4px 0 14px;letter-spacing:3px;}
  .end.die .big{color:#E2A79A;} .end.life .big{color:#BFE0C4;}
  .end .reason{font-size:14px;background:var(--paper);border:1px solid var(--line);border-left:3px solid var(--brand);
    border-radius:2px;padding:16px;text-align:left;margin:0 0 16px;line-height:1.95;color:var(--ink);}
  .end .share{font-size:12px;color:#A99C85;margin-bottom:18px;}
  .again{width:100%;border:1px solid var(--gold);background:transparent;color:var(--gold);border-radius:2px;
    padding:12px;font-size:14px;letter-spacing:3px;cursor:pointer;margin-bottom:10px;}
  .again:active{background:#2A342F;}
  .rech{width:100%;border:1px solid #4C544D;background:transparent;color:#B9AC94;border-radius:2px;
    padding:11px;font-size:13px;letter-spacing:2px;cursor:pointer;}
  .rech:active{background:#2A342F;}

  .toast{position:fixed;top:14%;left:50%;transform:translateX(-50%);background:var(--panel);
    border:1px solid var(--brand);color:#E9DFCB;padding:8px 22px;border-radius:2px;letter-spacing:4px;
    font-size:13px;z-index:99;pointer-events:none;opacity:0;animation:tst 1.9s ease forwards;}
  @keyframes tst{0%{opacity:0;transform:translate(-50%,-8px);}15%{opacity:1;transform:translate(-50%,0);}
    80%{opacity:1;transform:translate(-50%,0);}100%{opacity:0;transform:translate(-50%,0);}}

  .foot{margin-top:auto;padding:18px 0 max(18px,env(safe-area-inset-bottom));font-size:10px;
    color:#6E756C;text-align:center;letter-spacing:.5px;}

  .hide{display:none;}
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <header class="top">
    <div class="brand"><span class="sealbox">嫡</span><span class="name">重生当嫡女</span></div>
    <div class="meta"><span class="ep" id="ep">第 0 步</span></div>

  <div class="hr"></div>
  <div class="prog"><div class="bar"><i id="bar"></i></div><div class="dots" id="dots"></div></div>

  <section id="cover" class="cover">

    <div class="seal">宅 斗 · 重 生</div>
    <h1>重生当嫡女</h1>
    <div class="lead">深宅一梦，一念生死。<br>五十幕，幕幕皆局；<br>从及笄嫡女到满堂烛火，每条路通向不同的命数。</div>
    <div class="rulebox">📜 你重活一世，成了侯府嫡长女沈知微。故事分四卷：<b>重生归来 · 宅内暗涌 · 掌家之争 · 终局清算</b>。每个选择都会<b>岔路</b>——有的通向不同结局，有的当场殒命。共 13 种结局。含「重新开局」与「从本卷重来」。</div>
    <button class="start" id="startBtn">入 局</button>
  </section>

  <section id="chapter" class="hide chapter">

      <p class="ci" id="cIntro"></p><button class="go" id="cGo">续 卷</button>
    </div>
  </section>

  <section id="scene" class="hide">
    <div class="card"><div class="where" id="where"></div><p class="story" id="story"></p></div>
    <div id="opts"></div>
  </section>

  <section id="end" class="hide end">

    <span class="tag" id="endTag"></span><div class="big" id="endBig"></div>

    <button class="rech" id="rechBtn">从本卷重来</button>
  </section>

  <div class="foot">本作纯属虚构的娱乐向趣味测评，情节均非史实，不构成任何预言或建议。</div>
</div>

 ["卷 二","宅 内 暗 涌","议亲的人踏破门槛，柳氏要借你的婚事除掉你。中馈、药膳、私信、栽赃，桩桩件件都指向同一件事：这深宅里，容不下一个清醒的嫡女。你要在明枪暗箭里，护住母亲和弟弟。"],
 ["卷 三","掌 家 之 争","你握住了中馈的钥匙，也握住了柳氏的命门。账目、田产、族老、血统，每一场都是硬仗。这一卷，要在刀尖上把掌家权夺回来。"],
 ["卷 四","终 局 清 算","柳家末路，反扑最凶。父亲的病、官府的枷、余党的毒，最后的暗箭都在这时来。印信就在案上——这一卷，定你全剧终的结局，是主母、是良缘、还是抽身而去。"]];

 n2:{v:1,where:"昼 · 及笄礼·花厅",story:"及笄礼上，柳氏笑着捧出一支金簪要为你簪发——上一世，这簪里藏了针，让你当众见血失仪。",

  o:[{t:"按礼数应下相看，不急定亲",go:"n21"},{t:"欣然应下婚事，怕夜长梦多",end:"E_DU"},{t:"谦辞回绝，说门第不配",end:"E_QINGDENG"}]},
 n21:{v:2,where:"夜 · 母亲房中",story:"母亲病势渐重，拉着你说：「柳氏在你父亲书房里，藏了东西。」话没说完就昏了过去。",
  o:[{t:"先请可靠大夫稳住母亲，再图书房",go:"n22"},{t:"当夜就摸进书房去找",end:"E_LAOYU"},{t:"去问柳氏「书房里藏了什么」",end:"E_DU"}]},
 n22:{v:2,where:"昼 · 书房外",story:"你寻机进了书房，发现一个暗格，里面是柳氏与外人往来的信——涉及侯府田产被暗中变卖。",
  o:[{t:"只抄关键几页，原样放回",go:"n23"},{t:"把整叠信带走，留着当把柄",end:"E_LAOYU"},{t:"立刻拿去给父亲看",end:"E_DU"}]},
 n23:{v:2,where:"夜 · 花园",story:"知婉约你夜谈，屏退左右，忽然跪下来哭求你「成全」她和世子，说愿把嫡女之位让给你。",
  o:[{t:"扶起她，话说得滴水不漏，不落把柄",go:"n24"},{t:"心软答应让出婚事，换个清净",end:"E_MAI"},{t:"冷笑拆穿她，让她死了这条心",end:"E_HUIRONG"}]},
 n24:{v:2,where:"昼 · 中馈厅",story:"你正式接手部分中馈。管事婆子们当面恭敬，背地里阳奉阴违——尤其柳氏的心腹张嬷嬷。",
  o:[{t:"先按住张嬷嬷，当众立新规矩，赏罚分明",go:"n25"},{t:"快刀斩乱麻，把柳氏的人全撤了",end:"E_LAOYU"},{t:"先忍着，等站稳脚跟再动她",end:"E_QINGDENG"}]},
 n25:{v:2,where:"午 · 厨房",story:"母亲的药膳由张嬷嬷经手。今日你闻出药味不对——多了点不该有的苦杏仁味。",
  o:[{t:"悄悄留药渣，换自己人重煎，暗查来源",go:"n26"},{t:"当场发作，揪住张嬷嬷人赃并获",end:"E_DU"},{t:"让母亲先别喝，自己去查清楚",end:"E_SHANG"}]},
 n26:{v:2,where:"夜 · 柴房",story:"你查到张嬷嬷私通外人的实证。她跪地求饶，说愿供出柳氏全部罪证。",
  o:[{t:"留她一命，让她写下供词画押",go:"n27"},{t:"当场处置了她，以儆效尤",end:"E_LAOYU"},{t:"放她走，赌她念你的恩",end:"E_DU"}]},
 n27:{v:2,where:"昼 · 祖母院",story:"祖母病倒，柳氏主张「冲喜」，要把你匆匆嫁出去。祖母昏迷，无人做主。",
  o:[{t:"以嫡女身份主持侍疾，压住冲喜之说",go:"n28"},{t:"哭求父亲千万别答应",end:"E_MAI"},{t:"与柳氏在祖母床前争个明白",end:"E_ZHU"}]},
 n28:{v:2,where:"夜 · 母亲房中",story:"母亲醒了，告诉你书房暗格还有第二层——真正的证据在夹层里。与此同时，柳氏已察觉你动过书房。",
  o:[{t:"抢在柳氏前，连夜取走夹层",go:"n29"},{t:"先守着母亲，证据改日再取",end:"E_DU"},{t:"托心腹去取，自己不露面以免打草惊蛇",end:"E_LAOYU"}]},
 n29:{v:2,where:"昼 · 前厅",story:"柳氏反咬一口，说你在书房「私藏男子信物」，要父亲将你逐出。人证物证，似模似样。",
  o:[{t:"请父亲当众验那「信物」的墨迹与年份",go:"n30"},{t:"当众哭喊冤枉，让父亲看看谁在害你",end:"E_ZHU"},{t:"认下，只求别牵连母亲",end:"E_QINGDENG"}]},
 n30:{v:2,where:"夜 · 书房",story:"墨迹验出是新的，柳氏栽赃败露。父亲震怒，却仍犹豫——柳氏毕竟掌家多年，牵一发而动全身。",
  o:[{t:"不逼父亲，把证据收好，等最关键的时机",go:"n31"},{t:"逼父亲立刻休了柳氏",end:"E_LAOYU"},{t:"把柳氏的丑事散到族里，让她无地自容",end:"E_ZHU"}]},

 // ===== 卷三 掌家之争（n31–n40b）=====
 n31:{v:3,where:"昼 · 中馈厅",story:"柳氏被削了部分权，仍把持着田产铺子。你要彻底夺回中馈，就得先断了她的财路。",
  o:[{t:"从账目查起，把田产铺子的暗账理清",go:"n32"},{t:"直接派人接管铺子，先断了她的银子",end:"E_LAOYU"},{t:"把事情捅到族老那里，请族里主持公道",end:"E_ZHU"}]},
 n32:{v:3,where:"夜 · 铺子",story:"你查出柳氏暗中把侯府最赚钱的绸缎庄，转到了她娘家名下。经手的掌柜，是关键证人。",
  o:[{t:"先稳住掌柜，许诺保他一家，换他作证",go:"n33"},{t:"抓了掌柜逼供，速战速决",end:"E_LAOYU"},{t:"直接带人去绸缎庄当众对质",end:"E_DU"}]},
 n33:{v:3,where:"昼 · 祖母院",story:"祖母醒了。柳氏哭着在祖母面前扮可怜，说自己「一心为侯府」，反指你「容不下继母」。",
  o:[{t:"当着祖母的面，把账目与证人一件件摆出来",go:"n34"},{t:"与柳氏一起哭，比谁更委屈",end:"E_ZHU"},{t:"沉默不语，指望祖母自己看清",end:"E_QINGDENG"}]},
 n34:{v:3,where:"夜 · 祠堂",story:"族老聚齐，要审柳氏。柳氏却抛出一张「你生母当年与人私通」的旧帕子，反咬你血统不正。",
  o:[{t:"请出当年接生的稳婆与乳母，验明正身",go:"n35"},{t:"气得当众撕了那帕子",end:"E_ZHU"},{t:"哭着喊冤，却拿不出证据",end:"E_QINGDENG"}]},
 n35:{v:3,where:"昼 · 祠堂",story:"稳婆作证，你确是王氏亲生。柳氏栽赃落空，却仍咬定「无风不起浪」。风向未定。",
  o:[{t:"不穷追，只请族老记下今日之诬，来日清算",go:"n36"},{t:"逼族老当场处置柳氏",end:"E_LAOYU"},{t:"心软替柳氏求情，显你大度",end:"E_DU"}]},
 n36:{v:3,where:"昼 · 中馈厅",story:"你终于掌了中馈大权。第一件事，就是清算这些年被柳氏亏空的账，补上母亲的嫁妆。",
  o:[{t:"按规矩来，该追的追，该还的还",go:"n37"},{t:"把柳氏的人一撸到底，换上自己人",end:"E_LAOYU"},{t:"为安抚人心，把亏空一笔勾销",end:"E_QINGDENG"}]},
 n37:{v:3,where:"夜 · 闺房",story:"夜里你忽觉心悸，枕边的安神香是新换的。上一世，你也是从这一炉香开始，慢慢「病」下去的。",
  o:[{t:"立刻封了香炉留证，密召心腹彻查",go:"n38"},{t:"不动声色，等明日请平安脉再说",end:"E_DU"},{t:"把香炉扔了，先图个心安",end:"E_DU"}]},
 n38:{v:3,where:"昼 · 花园",story:"知婉约你见面，说愿「将功补过」，供出柳氏最后一处暗桩——条件是你保她一条活路。",
  o:[{t:"应下，但让她先交出实证",go:"n39"},{t:"信她，按她说的直接去抓人",end:"E_LAOYU"},{t:"一口回绝，说绝不容她",end:"E_DU"}]},
 n39:{v:3,where:"昼 · 前厅",story:"父亲终于看清柳氏真面目，问她该如何处置。柳氏跪下，抬眼看你——这一句，定她生死。",
  o:[{t:"依家法论处，不添不减，罪证交族老",go:"n40"},{t:"求父亲从重，要她偿命",end:"E_ZHU"},{t:"替她求情，说她也只是一时糊涂",end:"E_DU"}]},
 n40:{v:3,where:"夜 · 冷院",story:"柳氏被关进冷院，余党却未清。这一夜，你险些被一碗「赔罪汤」毒倒，幸被心腹拦下。",
  o:[{t:"将汤留证，顺线清掉余党",go:"n40b"},{t:"让她当面先饮一口以证无毒，再自己喝",end:"E_DU"},{t:"把经手的丫鬟都逐出府去，眼不见为净",end:"E_LAOYU"}]},
 n40b:{v:3,where:"昼 · 中馈厅",story:"余党清尽，你再无明面上的对手。镜中那人，已不是当年被一支簪子逼到绝境的嫡女。",
  o:[{t:"沉住气，先把侯府上下人心收拢",go:"n41"},{t:"大宴宾客，把这一仗的风光做足",end:"E_ZHU"},{t:"把当年欺你的人一一算账",end:"E_DU"}]},

 // ===== 卷四 终局清算（n41–n49）=====
 n41:{v:4,where:"昼 · 前厅",story:"父亲病重，把家业托付给你。柳氏的娘家却联合外人，说你「牝鸡司晨」，要夺侯府家产。",
  o:[{t:"稳住族老与家仆，先固根本，再对外",go:"n42"},{t:"单枪匹马去柳家理论",end:"E_LAOYU"},{t:"先把家产转移藏好，免得被夺",end:"E_ZHU"}]},
 n42:{v:4,where:"夜 · 书房",story:"你发现父亲病重也与柳家有关——他们买通了父亲身边的长随，在药里动手脚。",
  o:[{t:"换了长随，加派人手守着父亲的药，再取证",go:"n43"},{t:"直接抓了长随，斩草除根",end:"E_DU"},{t:"亲自守夜煎药，不假手他人",end:"E_SHANG"}]},
 n43:{v:4,where:"昼 · 祠堂",story:"族老会审柳家。柳家反咬你「勾结靖安侯府世子，图谋侯府家产」，把裴砚也牵扯进来。",
  o:[{t:"坦然陈情与世子只是议亲，出示书信自证",go:"n44"},{t:"为护世子，揽下所有罪责",end:"E_LAOYU"},{t:"反咬柳家勾结外人，却拿不出实证",end:"E_ZHU"}]},
 n44:{v:4,where:"夜 · 后园",story:"裴砚来见你，说愿以世子之位护你周全、娶你过门，条件是侯府从此依附靖安侯府。",
  o:[{t:"谢他，却说侯府的事，要自己扛",go:"n45"},{t:"答应依附世子府，借势自保",end:"E_ZHU"},{t:"一口回绝，与他断了往来",end:"E_DU"}]},
 n45:{v:4,where:"昼 · 前厅",story:"柳家最后一搏，买通官府，要以「私通外男、谋夺家产」拿你下狱。",
  o:[{t:"证据在手，先一步递状反告柳家",go:"n46"},{t:"等着官府来拿，清者自清",end:"E_LAOYU"},{t:"连夜带母亲弟弟出逃",end:"E_MAI"}]},
 n46:{v:4,where:"夜 · 公堂",story:"公堂之上，柳家买通的官老爷偏袒，眼看要屈打成招。",
  o:[{t:"当堂呈上柳家买通官吏的实证，反将一军",go:"n47"},{t:"据理力争，信青天大老爷",end:"E_LAOYU"},{t:"认罪，换母亲弟弟平安",end:"E_SHANG"}]},
 n47:{v:4,where:"昼 · 侯府",story:"柳家倒了。父亲弥留之际，把侯府印信交到你手上，说「这个家，交给你了」。",
  o:[{t:"接下印信，承诺护住母亲弟弟与侯府",go:"n48"},{t:"推辞，说自己撑不起",end:"E_ZHU"},{t:"当着父亲面发誓要柳家满门偿命",end:"E_DU"}]},
 n48:{v:4,where:"夜 · 后园",story:"尘埃将定，最后一道暗箭来了——柳氏余党买通了你的贴身丫鬟，在你今夜要饮的茶里下了东西。",
  o:[{t:"早有防备，换掉茶盏，将来人拿下",go:"n49"},{t:"是跟了多年的旧丫鬟递的，信得过，接了便喝",end:"E_DU"},{t:"把茶端去父亲面前，请他当场验看",end:"E_SHANG"}]},
 n49:{v:4,where:"夜 · 侯府正堂",story:"一切落定。侯府印信在案，母亲安康，弟弟承欢。从重生睁眼那一刻，到这满堂烛火——你终于走到了这里。接下来怎么活，你自己说了算。",
  o:[{t:"接下印信，撑起整个侯府",end:"E_ZHANGJIA"},{t:"与裴砚联手，把侯府做成京城第一",end:"E_YIN"},
     {t:"把家业交托，嫁个知心人",end:"E_LIANG"},{t:"带母亲弟弟远走他乡，再不问宅斗",end:"E_GUI"},{t:"这满府家业，本就该是我一个人的",end:"E_CIGE"}]}
};

const END={
 E_CHENTANG:{type:"die",title:"沉 塘",text:"你被扣上私通的罪名，族人将你沉了塘。水漫过口鼻时，你想起来——前世，也是这口塘。你倒在了第 __N__ 步。"},
 E_DU:{type:"die",title:"鸩 杀",text:"那一口，你以为是恩典，其实是柳氏的手笔。夜半呕血，锦被染红。深宅里，死得最静的，往往是最没防备的。你倒在了第 __N__ 步。"},
 E_LAOYU:{type:"die",title:"下 狱",text:"你被诬下狱，柳家买通了狱卒。祠堂的牌位还没添你的名字，牢里已经先没了你的气息。你倒在了第 __N__ 步。"},
 E_HUIRONG:{type:"die",title:"毁 容",text:"一场「意外」的滚水泼在脸上。容貌毁尽，你被关在后院，日复一日看着铜镜里的自己，直到心也一起烂掉。你倒在了第 __N__ 步。"},
 E_CIGE:{type:"die",title:"赐 死",text:"你揽权太过，触了众怒。一碗毒酒、三尺白绫，侯府给了你最后的体面。你倒在了第 __N__ 步。"},
 E_SHANG:{type:"die",title:"病 逝",text:"你终究没能撑住。心力交瘁，一病不起，药石无灵。哭声里，你慢慢闭上了眼。你倒在了第 __N__ 步。"},
 E_ZHU:{type:"die",title:"逐 出 毙 命",text:"一纸文书，你被逐出侯府、断绝宗籍。无家可归，你病死在城郊的破庙里，连个收尸的人都没有。你倒在了第 __N__ 步。"},
 E_MAI:{type:"die",title:"被 卖 异 乡",text:"你被柳氏使计卖到外乡，颠沛流离。不堪磋磨，你死在异乡的柴房里，无人知晓你的名字。你倒在了第 __N__ 步。"},
 E_QINGDENG:{type:"die",title:"庵 堂 病 殁",text:"你被送进家庙「静养」。青灯古佛，忧思成疾，你咳血而亡，母亲与弟弟的消息再没等到。你倒在了第 __N__ 步。"},
 E_ZHANGJIA:{type:"life",title:"掌家女主",text:"你接下印信，撑起整个侯府。母亲安康，弟弟成人，柳氏伏法。多年后，京中提起侯府，无人不道一声「沈大姑娘」。你终于把前世没走完的路，一步步走成了自己的路。全剧终。"},
 E_YIN:{type:"life",title:"联手权倾",text:"你与裴砚联手，一个掌内宅，一个握朝局。侯府成了京城第一等的门第，再无人敢轻慢。你们并肩站在高处，看这满城灯火。全剧终。"},
 E_LIANG:{type:"life",title:"良 缘",text:"你把家业交托妥当，嫁了个知冷知热的人。不必再算计，不必再防人。院里的海棠开了又落，你终于过上了前世想都不敢想的日子。全剧终。"},
 E_GUI:{type:"life",title:"归 隐",text:"你带着母亲和弟弟，远远离开了京城。江南小院里，炊烟袅袅，再不闻宅斗二字。这一世，你选了另一条路。全剧终。"}
};

const DTH={
"n1:1":"你想含一口试个真伪，可春杏就站在门边盯着。那口药一咽，三日后你昏在及笄礼上，亲事也被柳氏替你定了。你倒在了第 __N__ 步。",
"n1:2":"你把碗一推冷声质问。春杏当场哭喊「姑娘疯了」，柳氏顺势请人上门，把你送进家庙「静养」，一病不起。你倒在了第 __N__ 步。",
"n2:1":"你低头让她簪。簪尖划破额角，血顺着眉眼下淌。柳氏捂着心口喊「心疼」，满堂宾客却都记住了：侯府嫡女破相了。你倒在了第 __N__ 步。",
"n2:2":"你婉拒这簪，柳氏脸上挂不住，笑着说你嫌她的东西脏。一句不敬继母，足够让你在这府里再无立锥之地。你倒在了第 __N__ 步。",
"n3:1":"母亲硬顶着不交中馈，柳氏便在她的药里添了东西。你守着那碗药，看她一天天瘦下去，自己也没能撑住。你倒在了第 __N__ 步。",
"n3:2":"你自作主张去讨账本。柳氏笑着给了，转身就把「嫡女私翻中馈」的折子递到侯爷案头。你倒在了第 __N__ 步。",
"n4:1":"你把知婉驳得体无完肤，赢了满堂彩，也赢了她一辈子的恨。这宅子里，赢一句话的多半要还一条命。你倒在了第 __N__ 步。",
"n4:2":"你谦让说不如妹妹。祖母叹气，柳氏顺势道你「不堪造就」，没多久家庙里多了一个「养病」的嫡女。你倒在了第 __N__ 步。",
"n5:1":"你把父亲请来主持，柳氏当场认错，转头就换了弟弟的药。等你回过神，那孩子已经凉了半宿。你倒在了第 __N__ 步。",
"n5:2":"你守着弟弟物理降温，等天亮。天没亮，他就没了。你抱着那具小小的身子，也跟着病倒，再没起来。你倒在了第 __N__ 步。",
"n6:1":"你跪求车驾捎一程，满街都看着。世子府的管事记下「侯府嫡女当街攀附」，柳氏连夜递到族里。你倒在了第 __N__ 步。",
"n6:2":"你抬头朗声，他记住了你的脸——柳氏也记住了。三日后一碗「失手」的滚水，替你把这门心思烫干净了。你倒在了第 __N__ 步。",
"n7:1":"你拉着弟弟跪求父亲，被斥「撒泼顶撞」。柳氏一句「嫡女失仪」，就把你锁进了柴房。你倒在了第 __N__ 步。",
"n7:2":"你认下「坏了门风」，只求弟弟无事。柳氏心满意足，转头就送你去家庙「静心」，这一去就是半辈子。你倒在了第 __N__ 步。",
"n8:1":"你句句指向柳氏。侯爷越听越烦，柳氏反倒委屈。当夜你的汤药里多了一味「安神」的东西。你倒在了第 __N__ 步。",
"n8:2":"你沉默不辩，等父亲自己查。柳氏趁着这几日，把「赃物」塞进你的箱笼。人证物证俱全，你百口莫辩。你倒在了第 __N__ 步。",
"n9:1":"柳氏「好心」请来的太医，方子看着周全。母亲喝到第三剂咳得更凶——那药里是慢慢熬人的东西。你倒在了第 __N__ 步。",
"n9:2":"你寸步不离地煎药，可丫鬟的手比你的眼快。母亲到底没熬过那个冬天，你也熬干了。你倒在了第 __N__ 步。",
"n10:1":"你拿着钥匙大张旗鼓清点库房。柳氏转头告你「私吞中馈」，账上还「少了」几箱——偏就在你查过的屋里。你倒在了第 __N__ 步。",
"n10:2":"你把钥匙交给祖母以示无私，祖母转手就给了柳氏。没了中馈，你连母亲的药钱都做不了主，最后被送进家庙。你倒在了第 __N__ 步。",
"n11:1":"你连夜抱着账本去见父亲。柳氏反说账本是你「为夺权伪造」。侯爷看你的眼神，像看一个算计家产的陌生人。你倒在了第 __N__ 步。",
"n11:2":"你拿着真账去质问柳氏。她脸上笑着，心里已动杀机。三日后你的饭里多了一点不该有的东西。你倒在了第 __N__ 步。",
"n12:1":"你坦然承认账上有亏空，说自己正在查。这话隔天就变成「嫡女持家无能、账目不清」，传遍京城。你倒在了第 __N__ 步。",
"n12:2":"你涨红脸辩白「绝不是我贪的」。你越急越像心虚，名声一坏，连替你相看的人家都退了回去。你倒在了第 __N__ 步。",
"n13:1":"你揪住春杏，人赃并获。柳氏抢先哭诉，说那信是「嫡女私通外男」的铁证。你被锁进柴房。你倒在了第 __N__ 步。",
"n13:2":"你把信原样收好，静观其变。可柳氏手里那份是抄本，三日后「私通」的罪名还是扣下来，族人把你沉了塘。你倒在了第 __N__ 步。",
"n14:1":"你谦辞不接寿宴。祖母当众沉了脸，说你「不孝」。柳氏顺水推舟，送你去家庙「学规矩」。你倒在了第 __N__ 步。",
"n14:2":"你大包大揽事事亲为。寿宴前夜你撑不住病倒，席面乱套，「嫡女无能」四个字压下来。你倒在了第 __N__ 步。",
"n15:1":"你当着满堂宾客揭穿寿桃有药。宾客散去，祖母气得发抖——她要的是体面，不是真相。你被锁进祠堂。你倒在了第 __N__ 步。",
"n15:2":"你自掏腰包补上，把事瞒下来顾全大局。可柳氏早知道采买是你经手，转头咬定「嫡女采买不力」。你倒在了第 __N__ 步。",
"n16:1":"你趁热打铁抖出柳氏贪墨。可你手里只有账目，没有实证。一句「诬告继母」，把你关进祠堂。你倒在了第 __N__ 步。",
"n16:2":"你借祖母的夸，请她做主把中馈交给母亲。逼得太急，柳氏狗急跳墙，你的饭里就有了答案。你倒在了第 __N__ 步。",
"n17:1":"你当场回绝表少爷，说绝不嫁。侯爷的脸挂不住，柳氏跪地喊冤。一顶「忤逆」的帽子比任何算计都好用。你倒在了第 __N__ 步。",
"n17:2":"你顺水推舟先应下，想稳住再图后计。可柳氏办事极快，花轿抬出门你才知道，聘礼早被她吞了。你倒在了第 __N__ 步。",
"n18:1":"你应了私奔，夜里翻墙出府。火把在墙外亮起——柳氏早等着了。「嫡女私奔」四个字，够把你沉进那口塘。你倒在了第 __N__ 步。",
"n18:2":"你婉拒还请他别再来。陆家怀恨，把你的话添油加醋传出去，柳氏借这股风，让你在一场「意外」里毁了脸。你倒在了第 __N__ 步。",
"n19:1":"你上前替世子擦拭，满座命妇都看见了。「侯府嫡女勾引世子」的话传出去，你连辩的资格都没有。你倒在了第 __N__ 步。",
"n19:2":"你轻声点破知婉是故意的。世子没领情，反觉你刻薄。靖安侯府记恨上你，你的脸就在那场「意外」里毁了。你倒在了第 __N__ 步。",
"n20:1":"你欣然应下婚事，怕夜长梦多。柳氏绝容不得你嫁进侯府——那一夜，你的安神香就换了味道。你倒在了第 __N__ 步。",
"n20:2":"你谦辞回绝，说门第不配。靖安侯府觉得受了辱，柳氏顺势说你「不识抬举」，为平息两家脸面，你被送进家庙。你倒在了第 __N__ 步。",
"n21:1":"你当夜摸进书房。柳氏早埋了人守着，一声「抓贼」，你被当场拿住。「嫡女夜闯父书房」够你关到死。你倒在了第 __N__ 步。",
"n21:2":"你去问柳氏「书房藏了什么」。她笑着说你娘糊涂了，转头就给母亲换了重药。你倒在了第 __N__ 步。",
"n22:1":"你把整叠信带走。柳氏发现失窃，反咬你偷父亲机密、勾结外人。侯爷一怒，把你锁进祠堂。你倒在了第 __N__ 步。",
"n22:2":"你当场拿去给父亲看。可那些信牵扯太广，父亲不愿家丑外扬，只当你「搬弄是非」。柳氏趁你失势动了杀心。你倒在了第 __N__ 步。",
"n23:1":"你心软让出婚事，换个清净。柳氏得寸进尺，转头给你寻了户「好人家」，其实是拿你换了聘礼。你倒在了第 __N__ 步。",
"n23:2":"你冷笑拆穿她。知婉记恨在心，柳氏更容不得你。一场「失手」的滚水，替你把这辈子的脸都烫没了。你倒在了第 __N__ 步。",
"n24:1":"你一口气撤换了柳氏所有人。动静太大，柳氏告你「揽权排除异己」。祖母一查，账上偏偏真「少」了东西。你倒在了第 __N__ 步。",
"n24:2":"你先忍着，等站稳脚跟再动她。可中馈被蛀空，祖母大发雷霆，收权不说还把你送进家庙。你倒在了第 __N__ 步。",
"n25:1":"你当场揪住张嬷嬷，人赃并获。柳氏当夜「处置」了她，反咬你「逼死老仆、嫁祸主母」。死无对证。你倒在了第 __N__ 步。",
"n25:2":"你让母亲先别喝，自己去查。这一耽搁，毒已入骨。母亲走的那夜，你握着她的手，觉得这宅子冷得像口井。你倒在了第 __N__ 步。",
"n26:1":"你当场处置了张嬷嬷。出了人命，柳氏反咬你「私设刑堂、草菅人命」。你被锁进祠堂等发落。你倒在了第 __N__ 步。",
"n26:2":"你放她走，赌她念你的恩。她回去第一件事，就是把「嫡女已知」报给柳氏。当夜你房里多了一炉不一样的香。你倒在了第 __N__ 步。",
"n27:1":"你哭着求父亲别答应。可祖母昏迷、父亲耳软，柳氏三言两语就把你许了人家——那户要的不是媳妇，是冲喜的药引。你倒在了第 __N__ 步。",
"n27:2":"你在祖母床前与柳氏争个明白，被斥「不孝」。侯爷一怒写下文书与你断绝，把你逐出侯府。你倒在了第 __N__ 步。",
"n28:1":"你想先守着母亲，证据改日再取。柳氏连夜毁了夹层，又在母亲药里动手脚，两条路都断了。你倒在了第 __N__ 步。",
"n28:2":"你托心腹去取，自己不露面。所托非人，信转手就到了柳氏手里。第二天罪名就摆在你面前。你倒在了第 __N__ 步。",
"n29:1":"你当众哭喊冤枉，越哭越像心虚。侯爷听信柳氏，一纸文书把你逐出侯府、断绝宗籍。你倒在了第 __N__ 步。",
"n29:2":"你认了，只求别牵连母亲。柳氏「宽宏大量」地送你去家庙静思，青灯古佛，一病不起。你倒在了第 __N__ 步。",
"n30:1":"你逼父亲立刻休了柳氏。可柳氏掌家多年，牵一发而动全身。父亲反手把你禁了足，柳氏正好慢慢收拾你。你倒在了第 __N__ 步。",
"n30:2":"你把柳氏丑事散到族里。族老震怒，斥你「不守闺训、搬弄是非」，为侯府脸面把你逐出门墙。你倒在了第 __N__ 步。",
"n31:1":"你直接派人接管铺子。伙计闹了起来，出了人命。柳氏一句「嫡女仗势欺人」，把你告到官府。你倒在了第 __N__ 步。",
"n31:2":"你把事捅到族老那里。族老嫌你「越俎代庖」，干脆做主把你嫁了出去，眼不见为净。你倒在了第 __N__ 步。",
"n32:1":"你抓了掌柜逼供。他熬不住，反咬你「逼供害命」。官府一查，你从苦主变成凶手。你倒在了第 __N__ 步。",
"n32:2":"你带人去绸缎庄当众对质。柳氏抢先灭了口，反诬你「逼死掌柜、图谋家产」。你的饭里很快也多了东西。你倒在了第 __N__ 步。",
"n33:1":"你与柳氏对哭，比谁更委屈。祖母越看越烦，斥你「失仪」，为耳根清净做主把你嫁了出去。你倒在了第 __N__ 步。",
"n33:2":"你沉默，指望祖母自己看清。可柳氏嘴甜手快，先占了先机。祖母一句「这丫头心思重」，你就被送进家庙。你倒在了第 __N__ 步。",
"n34:1":"你气得当众撕了那帕子。族老看着满地碎布，只当你是心虚。「血统存疑」压下来，你被逐出族谱。你倒在了第 __N__ 步。",
"n34:2":"你哭着喊冤，却拿不出证据。血统的疑云一落下就再难洗清。族里把你「养」进家庙，对外只说嫡女生病。你倒在了第 __N__ 步。",
"n35:1":"你逼族老当场处置柳氏。可柳氏根基太深，族老不愿动她，反嫌你目无尊长，把你关进祠堂。你倒在了第 __N__ 步。",
"n35:2":"你心软替柳氏求情，显你大度。她喘过这口气，转头就把你当成必除之人。当夜你的茶就换了味道。你倒在了第 __N__ 步。",
"n36:1":"你把柳氏的人一撸到底。族里告你「任人唯亲、揽权自专」，祖母一怒收回你的权。你倒在了第 __N__ 步。",
"n36:2":"你为安抚人心把亏空一笔勾销。祖母得知大怒，斥你「失职」，收权不说还把你送进家庙。你倒在了第 __N__ 步。",
"n37:1":"你想着等明日平安脉再说。可慢毒不等脉，就着你的血走了一整夜。等太医赶到，脉象平稳得像从没毒过。你倒在了第 __N__ 步。",
"n37:2":"你吓得把香炉扔了，只求心安。证据没了，毒还在——下一炉香来得更安静。你倒在了第 __N__ 步。",
"n38:1":"你信了知婉，按她说的去抓人。到了地方才知是空局，反被诬「私闯民宅、构陷良善」。知婉当场反水。你倒在了第 __N__ 步。",
"n38:2":"你一口回绝，说绝不容她。知婉狗急跳墙，转头与柳氏合谋。你的饭里从此多了些说不清的东西。你倒在了第 __N__ 步。",
"n39:1":"你求父亲从重，要她偿命。侯爷看着你，眼神陌生——他要的是持家的女儿，不是索命的阎罗。族里以「心术不正」把你逐出门。你倒在了第 __N__ 步。",
"n39:2":"你替她求情，说她一时糊涂。柳氏被轻纵，喘过气来第一件事，就是在你的汤里还了这份「人情」。你倒在了第 __N__ 步。",
"n40:1":"你只让她先饮一口。她喝得那样诚恳，你便也喝了——毒不在汤里，在那只碗沿上，是给你一个人抹的。你倒在了第 __N__ 步。",
"n40:2":"你只把经手的丫鬟逐出府去，图个清净。真正的余党还在府里。三日后的夜里，你房里起了火。你倒在了第 __N__ 步。",
"n40b:1":"你大宴宾客，把风光做足。族老只看见一个张扬的嫡女——「德不配位」一传开，你被逐出侯府，再无人替你说话。你倒在了第 __N__ 步。",
"n40b:2":"你把当年欺你的人一一算账。树敌太多，总有一个人先动了手。你的茶里从此有了答案。你倒在了第 __N__ 步。",
"n41:1":"你单枪匹马去柳家理论。他们把你扣下，反诬你「上门寻衅、图谋家产」。官府的枷锁一套，你就再没出来。你倒在了第 __N__ 步。",
"n41:2":"你先把家产转移藏好。族里查出，指你「私吞家产」，一纸文书逐你出门，你冻死在破庙。你倒在了第 __N__ 步。",
"n42:1":"你直接抓了长随。柳家闻讯抢先下了重手，父亲没能熬过去。他们反咬你「气死亲父」。你倒在了第 __N__ 步。",
"n42:2":"你亲自守夜煎药，长随却另寻了法子。父亲还是走了。你被夺权，日夜守着灵堂，也跟着病倒。你倒在了第 __N__ 步。",
"n43:1":"你为护世子揽下所有罪责。裴砚全身而退，你却独自顶罪下狱，柳家买通狱卒，你就再没出来。你倒在了第 __N__ 步。",
"n43:2":"你反咬柳家勾结外人，却拿不出实证。族老斥你「信口构陷」，把你逐出族谱。你倒在了第 __N__ 步。",
"n44:1":"你答应依附世子府，借势自保。族里骂你「卖府求荣」，把你逐出侯府，你成了世子府一个无名无分的影子。你倒在了第 __N__ 步。",
"n44:2":"你一口回绝，与他断了往来。失了最后的助力，柳家反扑得毫无顾忌。你的饭里很快又多了东西。你倒在了第 __N__ 步。",
"n45:1":"你等着官府来拿人，想着清者自清。可这世上的「清」，得有人肯听。你被关进牢里，瘐死在一个没人问的冬夜。你倒在了第 __N__ 步。",
"n45:2":"你连夜带母亲弟弟出逃。半路盘缠被劫，一家人散在异乡。你被人贩子卖进深宅做粗使，再没等到天亮。你倒在了第 __N__ 步。",
"n46:1":"你据理力争，指望青天大老爷。可官官相护，柳家早打点好一切。屈打成招的文书一签，你就再没出去。你倒在了第 __N__ 步。",
"n46:2":"你认了罪，想换母亲弟弟平安。可你被定罪那一刻，母亲忧愤攻心，没撑过那个冬天。你抱着她的牌位，也病倒了。你倒在了第 __N__ 步。",
"n47:1":"你推辞印信，说自己撑不起。族里顺势另立旁支，说你「不堪托付」，把你请出侯府，你成了无家可归的嫡女。你倒在了第 __N__ 步。",
"n47:2":"你当着父亲面发誓要柳家满门偿命。戾气太盛，反被人抓住把柄，柳家余党借机在你的饭里动了手。你倒在了第 __N__ 步。",
"n48:1":"递茶的是跟了你多年的旧丫鬟。你不知道她早被人拿住了把柄——你信的那点情分，正是他们算好的。你倒在了第 __N__ 步。",
"n48:2":"你把茶端到父亲面前。这一闹，柳家余党知道你已起疑，当夜便动了手——你死在睡梦里，连喊都没喊出声。你倒在了第 __N__ 步。",
"n49:4":"你独揽大权，触了众怒。一碗毒酒、三尺白绫，侯府给了你最后的体面。你倒在了第 __N__ 步。"
};

let step=0,prevV=0,volStart="n1",volStep=1,pending="";
const $=id=>document.getElementById(id);
const cover=$("cover"),chapter=$("chapter"),scene=$("scene"),end=$("end");
const SAVE_KEY="zdsn_save_v1";
function save(st){try{st.step=step;st.prevV=prevV;st.volStart=volStart;st.volStep=volStep;st.pending=pending;localStorage.setItem(SAVE_KEY,JSON.stringify(st));}catch(e){}}
function clearSave(){try{localStorage.removeItem(SAVE_KEY);}catch(e){}}
function restore(){let s=null;try{s=JSON.parse(localStorage.getItem(SAVE_KEY));}catch(e){}
  if(!s||s.screen==="cover")return;
  step=s.step;prevV=s.prevV;volStart=s.volStart;volStep=s.volStep;pending=s.pending;
  updateEp();renderDots();
  if(s.screen==="scene")paintScene(s.node);
  else if(s.screen==="chapter")showChapter(s.node);
  else if(s.screen==="end")showEnd(s.endId,s.key);}
function show(e){e.classList.remove("hide");} function hide(e){e.classList.add("hide");}
function renderDots(){const d=$("dots");d.innerHTML="";VOLS.forEach((_,k)=>{if(k<1)return;const i=document.createElement("i");if(k<=prevV)i.className="on";d.appendChild(i);});}
function updateEp(){const total=Object.keys(NODES).length;$("ep").textContent=`第 ${step} 步 / 共 ${total} 幕`;$("bar").style.width=(step/total*100)+"%";}
function toast(msg){const t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),1900);}
function go(id){
  const n=NODES[id];
  if(n.v!==prevV){ prevV=n.v; volStart=id; volStep=step+1; pending=id; showChapter(id); return; }
  step++; updateEp(); renderDots(); paintScene(id);
}
function showChapter(id){const n=NODES[id];const v=VOLS[n.v];
  $("cVol").textContent=v[0];$("cTitle").textContent=v[1];$("cIntro").textContent=v[2];
  hide(scene);hide(end);show(chapter);renderDots();save({screen:"chapter",node:id});}
function paintScene(id){const n=NODES[id];
  const v=VOLS[n.v];$("where").textContent=`${v[0]} · ${n.where}`;$("story").textContent=n.story;
  const shuf=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
  const box=$("opts");box.innerHTML="";shuf(n.o.map((op,i)=>({op,i}))).forEach(({op,i})=>{const b=document.createElement("button");b.className="opt";b.textContent=op.t;
    b.onclick=()=>op.end?showEnd(op.end,id+":"+i):go(op.go);box.appendChild(b);});
  hide(chapter);hide(end);show(scene);window.scrollTo(0,0);
  save({screen:"scene",node:id});}
function showEnd(id,key){const e=END[id];const txt=((key&&DTH[key])||e.text).replace("__N__",step);
  end.className="end "+e.type;$("endTag").textContent=e.type==="die"?"大 结 局":"结 局";
  $("endBig").textContent=e.title;$("endReason").textContent=txt;
  $("endShare").textContent=e.type==="die"?`📌 你只活到了第 ${step} 步…截个图，看看朋友能走几步～`:`📌 你走到了第 ${step} 步，结局「${e.title}」～截个图炫耀！`;
  hide(scene);hide(chapter);show(end);window.scrollTo(0,0);save({screen:"end",endId:id,key:key});}

$("startBtn").onclick=()=>{clearSave();step=0;prevV=0;volStart="n1";volStep=1;hide(cover);go("n1");};
$("cGo").onclick=()=>{go(pending);};
$("againBtn").onclick=()=>{clearSave();step=0;prevV=0;volStart="n1";volStep=1;hide(end);hide(chapter);show(cover);};
$("rechBtn").onclick=()=>{step=volStep-1;go(volStart);};

// 本地售卖版：无口令锁，直接进入
restore();
</script>
</body>
</html>
